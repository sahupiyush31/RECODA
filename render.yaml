services:
  - type: web
    name: recoda
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r DataFix/backend/requirements.txt"
    startCommand: "cd DataFix/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
